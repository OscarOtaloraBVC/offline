# devlake-sync-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: devlake-sync-script-gdd
  namespace: devlake
data:
  extract_and_transform_gdd.py: |
    import requests
    import os
    import json
    import base64
    import time
    import csv
    from datetime import datetime, timedelta, timezone

    # ============================================================
    # CONFIGURACIÓN
    # ============================================================
    JIRA_URL = os.getenv("JIRA_URL")
    EMAIL = os.getenv("EMAIL")
    API_TOKEN = os.getenv("API_TOKEN")
    JQL = "project=GDD"

    # Parámetros de DevLake (desde el Secret)
    DEVLAKE_URL = os.getenv("DEVLAKE_URL", "http://devlake-lake:8080")
    BOARD_ID = os.getenv("BOARD_ID")
    BOARD_NAME = os.getenv("BOARD_NAME")

    # Rutas
    OUTPUT_CSV = "/app/issues_gdd.csv"
    DEVLAKE_ENDPOINT = f"{DEVLAKE_URL}/plugins/customize/csvfiles/issues.csv"

    FIELDS = "summary,description,status,issuetype,priority,assignee,creator,created,updated,resolutiondate,timeoriginalestimate,timespent,timeestimate,labels,parent,components,customfield_10016,customfield_11204,customfield_10144,customfield_10145,customfield_13851"

    COLUMNS = [
        "id", "_raw_data_params", "url", "issue_key", "title",
        "description", "type", "status", "original_status", "original_type",
        "story_point", "resolution_date", "created_date", "updated_date",
        "parent_issue_id", "priority", "original_estimate_minutes",
        "time_spent_minutes", "time_remaining_minutes", "creator_id",
        "creator_name", "assignee_id", "assignee_name", "severity",
        "component", "lead_time_minutes", "original_project", "labels",
        "urgency", "is_subtask", "due_date", "fix_versions",
        "event_report_date", "event_start_date", "event_end_date",
        "end_definitive_correction_mttr"
    ]

    # ============================================================
    # UTILIDADES
    # ============================================================
    def adf_to_text(node):
        if node is None:
            return ""
        if isinstance(node, str):
            return node
        if isinstance(node, dict):
            if node.get("type") == "text":
                return node.get("text", "")
            parts = []
            for child in node.get("content", []):
                parts.append(adf_to_text(child))
            return " ".join(p for p in parts if p)
        if isinstance(node, list):
            return " ".join(adf_to_text(n) for n in node)
        return ""


    def fmt_date(iso_str):
        if not iso_str:
            return None
        try:
            dt = datetime.strptime(iso_str[:19], "%Y-%m-%dT%H:%M:%S")
            if len(iso_str) >= 24 and iso_str[19] == '.':
                tz_str = iso_str[23:]
                sign = 1 if tz_str[0] == '+' else -1
                offset = timezone(timedelta(
                    hours=sign * int(tz_str[1:3]),
                    minutes=sign * int(tz_str[3:5])
                ))
                dt = dt.replace(tzinfo=offset).astimezone(timezone.utc)
            return dt.strftime("%Y-%m-%d %H:%M:%S")
        except Exception as e:
            print(f"⚠️ Error formateando fecha '{iso_str}': {e}")
            return None


    def fmt_local(iso_str):
        if not iso_str:
            return None
        try:
            return iso_str[:19].replace('T', ' ')
        except Exception as e:
            print(f"⚠️ Error formateando fecha local '{iso_str}': {e}")
            return None


    def to_minutes(seconds):
        if seconds is None:
            return None
        return int(seconds // 60)

    # ============================================================
    # NUEVA FUNCIÓN: MAPEO DE ESTADOS A DEVLAKE
    # ============================================================
    def map_status_to_devlake(jira_status_name):
        """
        Traduce los estados de Jira a los estados estándar de DevLake:
        TODO, IN_PROGRESS, DONE
        """
        if not jira_status_name:
            return "TODO"
        
        # Normalizamos a minúsculas para comparar fácilmente
        status_lower = jira_status_name.lower()
        
        # Estados que representan trabajo terminado
        if status_lower in ["cerrado", "closed", "done", "resolved", "resuelto", "finalizado"]:
            return "DONE"
        
        # Estados que representan trabajo en curso
        if status_lower in ["in progress", "en progreso", "in review", "en revisión", "in testing", "en pruebas", "blocked", "bloqueado", "información incompleta"]:
            return "IN_PROGRESS"
        
        # Estados que representan trabajo pendiente (To Do, Backlog, Open, etc.)
        if status_lower in ["to do", "por hacer", "open", "abierto", "backlog", "new", "nuevo"]:
            return "TODO"
        
        # Fallback: si no coincide con ninguno, lo dejamos como TODO
        print(f"⚠️ Estado no mapeado: '{jira_status_name}'. Se asignará 'TODO' por defecto.")
        return "TODO"


    # ============================================================
    # 1. EXTRACCIÓN DE JIRA
    # ============================================================
    def extract_issues():
        auth = base64.b64encode(f"{EMAIL}:{API_TOKEN}".encode()).decode()
        headers = {
            "Authorization": f"Basic {auth}",
            "Accept": "application/json",
            "Content-Type": "application/json"
        }

        all_issues = []
        next_token = None
        page = 0

        while True:
            page += 1
            payload = {
                "jql": JQL,
                "maxResults": 100,
                "fields": FIELDS.split(",")
            }
            if next_token:
                payload["nextPageToken"] = next_token

            resp = requests.post(
                f"{JIRA_URL}/rest/api/3/search/jql",
                headers=headers,
                json=payload
            )
            resp.raise_for_status()
            data = resp.json()

            issues = data.get("issues", [])
            all_issues.extend(issues)
            print(f"📥 Página {page}: {len(issues)} issues (total acumulado: {len(all_issues)})")

            next_token = data.get("nextPageToken")
            if not next_token or data.get("isLast", False):
                break
            time.sleep(0.3)

        print(f"✅ Extracción completa: {len(all_issues)} issues")
        return all_issues


    # ============================================================
    # 2. TRANSFORMACIÓN A FILAS CSV
    # ============================================================
    def transform_issues(issues):
        rows = []
        for issue in issues:
            fields = issue.get("fields", {})
            assignee = fields.get("assignee") or {}
            creator = fields.get("creator") or {}
            parent = fields.get("parent") or {}
            status_obj = fields.get("status") or {}
            issuetype = fields.get("issuetype") or {}
            priority = fields.get("priority") or {}
            components = fields.get("components") or []

            component_names = ",".join(
                [c.get("name", "") for c in components]
            ) if components else None

            # Extraemos el nombre del status ("In Progress", "Cerrado", etc.)
            original_status_name = status_obj.get("name", None)
            
            # Mapeamos el estado al estándar de DevLake
            devlake_status = map_status_to_devlake(original_status_name)

            row = {
                "id": f"jira:GDD:{issue.get('id')}",
                "_raw_data_params": None,
                "url": issue.get("self", None),
                "issue_key": issue.get("key", None),
                "title": fields.get("summary", None),
                "description": adf_to_text(fields.get("description")) or None,
                "type": issuetype.get("name", None),
                "status": devlake_status,              # <-- AHORA ES TODO/IN_PROGRESS/DONE
                "original_status": original_status_name, # <-- Guardamos el original de Jira
                "original_type": issuetype.get("name", None),
                "story_point": fields.get("customfield_10016") or None,
                "resolution_date": fmt_date(fields.get("resolutiondate")),
                "created_date": fmt_date(fields.get("created")),
                "updated_date": fmt_date(fields.get("updated")),
                "parent_issue_id": parent.get("id", None) if parent else None,
                "priority": priority.get("name", None),
                "original_estimate_minutes": to_minutes(fields.get("timeoriginalestimate")),
                "time_spent_minutes": to_minutes(fields.get("timespent")),
                "time_remaining_minutes": to_minutes(fields.get("timeestimate")),
                "creator_id": creator.get("accountId", None),
                "creator_name": creator.get("displayName", None),
                "assignee_id": assignee.get("accountId", None),
                "assignee_name": assignee.get("displayName", None),
                "severity": None,
                "component": component_names,
                "lead_time_minutes": None,
                "original_project": "Gestión de Disponibilidad y Degradación",
                "labels": ",".join(fields.get("labels", [])) if fields.get("labels") else None,
                "urgency": None,
                "is_subtask": None,
                "due_date": None,
                "fix_versions": None,
                "event_report_date": fmt_local(fields.get("customfield_11204")),
                "event_start_date": fmt_local(fields.get("customfield_10144")),
                "event_end_date": fmt_local(fields.get("customfield_10145")),
                "end_definitive_correction_mttr": fmt_local(fields.get("customfield_13851"))
            }
            rows.append(row)

        return rows


    # ============================================================
    # 3. ESCRITURA DEL CSV
    # ============================================================
    def write_csv(rows, path):
        with open(path, "w", newline="", encoding="utf-8") as f:
            writer = csv.DictWriter(f, fieldnames=COLUMNS)
            writer.writeheader()
            for r in rows:
                r_clean = {
                    k: ("NULL" if v is None or v == "" else v)
                    for k, v in r.items()
                }
                writer.writerow(r_clean)
        print(f"💾 CSV escrito en: {path}")


    # ============================================================
    # 4. SUBIDA A DEVLAKE (integrada con requests)
    # ============================================================
    def upload_to_devlake(csv_path):
        if not os.path.exists(csv_path):
            raise FileNotFoundError(f"No existe el archivo: {csv_path}")

        print(f"📤 Subiendo {csv_path} a {DEVLAKE_ENDPOINT}...")
        with open(csv_path, "rb") as f:
            response = requests.post(
                DEVLAKE_ENDPOINT,
                files={"file": ("issues_gdd.csv", f, "text/csv")},
                data={
                    "boardId": BOARD_ID,
                    "boardName": BOARD_NAME,
                    "incremental": "true"
                },
                timeout=300
            )

        print(f"📡 DevLake respondió: HTTP {response.status_code}")
        if not response.ok:
            print(f"❌ Cuerpo de respuesta: {response.text[:1000]}")
            response.raise_for_status()

        print(f"✅ Subida exitosa: {response.text[:500]}")


    # ============================================================
    # MAIN
    # ============================================================
    if __name__ == "__main__":
        print("🚀 Iniciando extracción desde Jira...")
        issues = extract_issues()

        print("🔄 Transformando issues a formato DevLake...")
        rows = transform_issues(issues)

        print(f"💾 Escribiendo {OUTPUT_CSV}...")
        write_csv(rows, OUTPUT_CSV)

        print(f"✅ Proceso de extracción completado: {len(rows)} filas")

        # Subida a DevLake
        upload_to_devlake(OUTPUT_CSV)

        # Eliminación del archivo temporal
        print("🧹 Eliminando archivo temporal...")
        os.remove(OUTPUT_CSV)
        print("✅ Archivo eliminado.")

        print("\n🎉 Proceso completo: extracción + carga + limpieza.")
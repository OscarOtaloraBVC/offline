              "rawSql": "WITH _requirements AS (\n  SELECT\n    COUNT(DISTINCT i.id) AS total_count,\n    COUNT(DISTINCT CASE WHEN i.status = 'DONE' THEN i.id ELSE NULL END) AS delivered_count\n  FROM issues i\n    JOIN board_issues bi ON i.id = bi.issue_id\n  WHERE \n    i.type IN (${type})\n    AND $__timeFilter(i.created_date)\n    AND bi.board_id IN (${board_id})\n)\n\nSELECT \n  NOW() AS time,\n  CASE \n    WHEN total_count = 0 THEN 0\n    ELSE 1.0 * delivered_count / total_count \n  END AS requirement_delivery_rate\nFROM _requirements",

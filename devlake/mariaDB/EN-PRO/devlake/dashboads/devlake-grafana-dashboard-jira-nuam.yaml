              "rawSql": "SELECT\n  STR_TO_DATE(DATE_FORMAT(i.created_date, '%Y-%m-01'), '%Y-%m-%d') AS time,\n  COUNT(DISTINCT CASE WHEN i.status != 'DONE' THEN i.id ELSE NULL END) AS 'Number of Open Issues',\n  COUNT(DISTINCT CASE WHEN i.status = 'DONE' THEN i.id ELSE NULL END) AS 'Number of Delivered Issues'\nFROM issues i\n  JOIN board_issues bi ON i.id = bi.issue_id\n  JOIN boards b ON bi.board_id = b.id\nWHERE \n  i.type IN (${type})\n  AND $__timeFilter(i.created_date)\n  AND bi.board_id IN (${board_id})\nGROUP BY 1\nORDER BY 1",

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cloudnative-kc-b
  namespace: keycloak-b
spec:
  instances: 3
  storage:
    size: 1Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: keycloak-nuam-b
      owner: admin
      secret:
        name: pg-secret-keycloak
  superuserSecret:
    name: pg-superuser-keycloak
  postgresql:
    parameters:
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "all"
      pg_stat_statements.track_utility: "off"
      pg_stat_statements.save: "on"
      log_line_prefix: '%m [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h,session=%c '
      log_lock_waits: "on"
      deadlock_timeout: "1s"
      log_error_verbosity: "default"
      track_activities: "on"
      track_counts: "on"
      log_connections: "on"
      log_disconnections: "on"
      "pgaudit.log": "ddl,role"
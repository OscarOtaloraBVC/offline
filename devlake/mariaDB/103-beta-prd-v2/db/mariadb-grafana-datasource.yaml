apiVersion: v1
kind: ConfigMap
metadata:
  name: devlake-grafana-datasource-mariadb
  namespace: devlake
  labels:
    app: devlake
    app.kubernetes.io/instance: devlake
    app.kubernetes.io/part-of: devlake
    helm.toolkit.fluxcd.io/name: devlake
    helm.toolkit.fluxcd.io/namespace: devlake
    heritage: Helm
    release: devlake
data:
  mariadb.yaml: |
    apiVersion: 1
    datasources:
      - name: mariadb
        type: mysql
        access: proxy
        url: devlake-mariadb.devlake.svc.cluster.local:3306
        database: lake
        user: $MYSQL_USER
        isDefault: true
        jsonData:
          tlsSkipVerify: true
        secureJsonData:
          password: $MYSQL_PASSWORD
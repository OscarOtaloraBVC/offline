apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-mariadb
  namespace: devlake
  labels:
    grafana_datasource: "1"   # Grafana sidecar 
data:
  mariadb.yaml: |
    apiVersion: 1
    datasources:
      - name: mariadb
        type: mysql
        access: proxy
        url: devlake-mariadb.devlake.svc.cluster.local:3306
        database: lake
        user: ${MYSQL_USER}
        isDefault: true
        editable: false
        jsonData:
          maxOpenConns: 10
          maxIdleConns: 5
          connMaxLifetime: 14400
        secureJsonData:
          password: ${MYSQL_PASSWORD}